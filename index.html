<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Not Found</title>
    <style>
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Tahoma', sans-serif;
            color: #e0e0e0;
            text-align: center;
        }
        .error-box {
            background: #16213e;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            border: 2px solid #d4a017;
        }
        h1 {
            color: #d4a017;
            font-size: 60px;
            margin: 0;
        }
        p {
            font-size: 18px;
            color: #aaa;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="error-box">
        <h1>404</h1>
        <p>Page Not Found</p>
        <p style="font-size:12px;margin-top:20px;">The requested resource is not available.</p>
    </div>
</body>
</html>
